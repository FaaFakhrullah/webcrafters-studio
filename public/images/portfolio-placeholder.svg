  <text x="100" y="260" fill="#ffffff" font-size="72" font-family="Manrope, Arial, sans-serif" font-weight="700">WebCrafters Studio</text>
  <text x="100" y="340" fill="#bae6fd" font-size="38" font-family="Manrope, Arial, sans-serif">Portfolio Project Preview</text>
